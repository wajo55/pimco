<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Website</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="logo">PIMCO</div>
    <ul>
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <section id="home" class="hero">
    <h1>Welcome to My Website</h1>
    <p>Modern landing page with animations</p>
    <button onclick="scrollToSection('contact')">Get Started</button>
  </section>

  <section id="about" class="section">
    <h2>About</h2>
    <p>This is a free website example like the one you showed.</p>
  </section>

  <section id="services" class="section">
    <h2>Services</h2>
    <div class="cards">
      <div class="card">Crypto Dashboard</div>
      <div class="card">Wallet Tracker</div>
      <div class="card">Token Price Monitor</div>
    </div>
  </section>

  <section id="contact" class="section">
    <h2>Contact</h2>
    <form class="form">
      <input type="text" placeholder="Your Name" required />
      <input type="email" placeholder="Your Email" required />
      <textarea placeholder="Your Message"></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

  <footer>
    <p>© 2026 wajahat rocky | Free Hosting</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
